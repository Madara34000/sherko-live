<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autorisation – Sherko Live Studio</title>
  <style>
    :root { --bg:#0e0e11; --fg:#f4f4f5; --muted:#a1a1aa; --accent:#ff3c4b; }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; text-align:center; }
    main { max-width:520px; margin:0 auto; padding:80px 16px; }
    h1 { font-size:1.5rem } h1 span { color:var(--accent) }
    p { color:var(--muted) }
    code { color:var(--fg); word-break:break-all }
  </style>
</head>
<body>
<main>
  <h1><span>Sherko</span> Live Studio</h1>
  <p id="msg">Autorisation reçue. Vous pouvez fermer cette fenêtre.</p>
  <script>
    // Affiche juste un statut ; le code d'autorisation reste dans l'URL et est traité par l'équipe.
    var p = new URLSearchParams(location.search);
    if (p.get('error')) { document.getElementById('msg').textContent = 'Autorisation refusée : ' + p.get('error'); }
  </script>
</main>
</body>
</html>
